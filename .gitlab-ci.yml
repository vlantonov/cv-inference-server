# GitLab CI/CD mirror of the GitHub Actions pipeline (project targets both).
# Same CPU-only contract: modern CMake + g++, GoogleTest via FetchContent, all
# heavy/GPU deps auto-gated OFF (design §12, NFR-8). Kept lean and free-tier safe.
stages:
  - build-test
  - sanitizers
  - pages

default:
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends cmake g++ make ca-certificates util-linux
    - cmake --version
    - g++ --version

variables:
  # Keep FetchContent downloads in a stable, cacheable path.
  FETCHCONTENT_BASE_DIR: "$CI_PROJECT_DIR/.deps"

# GoogleTest is version+hash-pinned in tests/CMakeLists.txt, so cache on it.
.deps_cache: &deps_cache
  cache:
    key:
      files:
        - tests/CMakeLists.txt
    paths:
      - .deps/

# ---------------------------------------------------------------------------
# Plain CPU Release build + full test suite.
# ---------------------------------------------------------------------------
build-test:
  stage: build-test
  <<: *deps_cache
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - cmake --build build --parallel
    - ctest --test-dir build --output-on-failure

# ---------------------------------------------------------------------------
# Sanitizer matrix: TSan and ASan/UBSan.
#
# QA defect D-1: DISCOVERY_MODE PRE_TEST (tests/CMakeLists.txt) keeps the build
# green by deferring test discovery to ctest, and `setarch -R` disables ASLR so
# the instrumented binary maps cleanly on high-entropy kernels.
# ---------------------------------------------------------------------------
sanitizers:
  stage: sanitizers
  <<: *deps_cache
  parallel:
    matrix:
      - CVIS_SANITIZER: [thread, address]
  script:
    - >
      cmake -S . -B build-san
      -DCMAKE_BUILD_TYPE=Debug
      -DCVIS_ENABLE_SANITIZERS=ON
      -DCVIS_SANITIZER=$CVIS_SANITIZER
    - cmake --build build-san --parallel
    - setarch "$(uname -m)" -R ctest --test-dir build-san --output-on-failure

# ---------------------------------------------------------------------------
# Publish the Doxygen documentation to GitLab Pages.
#
# GitLab Pages contract: the job MUST be named `pages`, and the site it serves
# MUST end up in a `public/` directory declared as an artifact. Still CPU-only
# and free-tier safe -- the docs toolchain is plain apt packages: doxygen +
# graphviz (`dot`) + plantuml (pulls a JRE). PlantUML's bundled C4 stdlib
# resolves OFFLINE, so the C4 component diagram needs no network.
#
# The default `before_script` installs cmake/g++; we extend it here (and do NOT
# override it) so the docs toolchain is added on top without breaking it.
# No FetchContent in the docs build, so the shared .deps cache is intentionally
# not reused -- keep this job lean.
# ---------------------------------------------------------------------------
pages:
  stage: pages
  # Default branch only -- keeps published docs authoritative and free-tier safe.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - !reference [default, before_script]
    - apt-get install -y -qq --no-install-recommends doxygen graphviz plantuml
    - doxygen --version
    - dot -V
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCVIS_BUILD_DOCS=ON
    - cmake --build build --target docs
    # GitLab Pages serves whatever lands in public/.
    - rm -rf public
    - mv build/docs/html public
  artifacts:
    paths:
      - public
